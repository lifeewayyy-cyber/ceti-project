<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 540" width="100%" height="auto" style="background-color: #ffffff; border-radius: 12px; padding: 10px;">
  <style>
    .title { font-family: system-ui, -apple-system, sans-serif; font-size: 16px; font-weight: bold; fill: #0052CC; }
    .sub-text { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; font-weight: bold; fill: #1E293B; }
    .val-text { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; fill: #1E293B; }
    .delta-text { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; font-weight: bold; fill: #FFFFFF; }
  </style>

  <!-- Блок 1: Адаптивное квантование -->
  <rect x="10" y="10" width="500" height="150" rx="12" fill="#F0F4FF" stroke="#0052CC" stroke-width="2"/>
  <text x="30" y="42" class="title">1. Адаптивное квантование</text>
  
  <rect x="30" y="65" width="95" height="70" rx="8" fill="#FFFFFF" stroke="#0080FF" stroke-width="1.5"/>
  <text x="77" y="106" class="sub-text" text-anchor="middle">S = 8</text>

  <rect x="145" y="65" width="95" height="70" rx="8" fill="#FFFFFF" stroke="#0080FF" stroke-width="1.5"/>
  <text x="192" y="106" class="sub-text" text-anchor="middle">S = 16</text>

  <rect x="260" y="65" width="95" height="70" rx="8" fill="#FFFFFF" stroke="#0080FF" stroke-width="1.5"/>
  <text x="307" y="106" class="sub-text" text-anchor="middle">S = 32</text>

  <rect x="375" y="65" width="95" height="70" rx="8" fill="#FFFFFF" stroke="#0080FF" stroke-width="1.5"/>
  <text x="422" y="106" class="sub-text" text-anchor="middle">S = 64</text>

  <!-- Блок 2: Delta-кодирование -->
  <rect x="10" y="180" width="500" height="160" rx="12" fill="#F0F4FF" stroke="#0052CC" stroke-width="2"/>
  <text x="30" y="212" class="title">2. Delta-кодирование (Δp = pᵢ - pᵢ₋₁)</text>
  
  <text x="77" y="248" class="val-text" text-anchor="middle">p = 200</text>
  <line x1="110" y1="244" x2="145" y2="244" stroke="#0080FF" stroke-width="2" marker-end="url(#arrow)"/>
  
  <text x="192" y="248" class="val-text" text-anchor="middle">p = 201</text>
  <line x1="225" y1="244" x2="260" y2="244" stroke="#0080FF" stroke-width="2" marker-end="url(#arrow)"/>
  
  <text x="307" y="248" class="val-text" text-anchor="middle">p = 202</text>
  <line x1="340" y1="244" x2="375" y2="244" stroke="#0080FF" stroke-width="2" marker-end="url(#arrow)"/>
  
  <text x="422" y="248" class="val-text" text-anchor="middle">p = 203</text>

  <rect x="37" y="270" width="80" height="45" rx="6" fill="#0052CC"/>
  <text x="77" y="297" class="delta-text" text-anchor="middle">200</text>

  <rect x="152" y="270" width="80" height="45" rx="6" fill="#0052CC"/>
  <text x="192" y="297" class="delta-text" text-anchor="middle">+1</text>

  <rect x="267" y="270" width="80" height="45" rx="6" fill="#0052CC"/>
  <text x="307" y="297" class="delta-text" text-anchor="middle">+1</text>

  <rect x="382" y="270" width="80" height="45" rx="6" fill="#0052CC"/>
  <text x="422" y="297" class="delta-text" text-anchor="middle">+1</text>

  <!-- Блок 3: Фрактальный обход -->
  <rect x="10" y="360" width="500" height="160" rx="12" fill="#F0F4FF" stroke="#0052CC" stroke-width="2"/>
  <text x="30" y="392" class="title">3. Фрактальный обход (2D)</text>
  
  <path d="M 80 500 L 80 440 L 160 440 L 160 500 L 240 500 L 320 500 L 320 440 L 240 440 L 240 420 L 320 420 L 320 470 L 420 470" fill="none" stroke="#0052CC" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/>
  
  <circle cx="80" cy="500" r="5" fill="#0080FF"/>
  <circle cx="80" cy="440" r="5" fill="#0080FF"/>
  <circle cx="160" cy="440" r="5" fill="#0080FF"/>
  <circle cx="160" cy="500" r="5" fill="#0080FF"/>
  <circle cx="240" cy="500" r="5" fill="#0080FF"/>
  <circle cx="320" cy="500" r="5" fill="#0080FF"/>
  <circle cx="320" cy="440" r="5" fill="#0080FF"/>
  <circle cx="240" cy="440" r="5" fill="#0080FF"/>
  <circle cx="240" cy="420" r="5" fill="#0080FF"/>
  <circle cx="320" cy="420" r="5" fill="#0080FF"/>
  <circle cx="320" cy="470" r="5" fill="#0080FF"/>
  <circle cx="420" cy="470" r="5" fill="#0080FF"/>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0080FF" />
    </marker>
  </defs>
</svg>
